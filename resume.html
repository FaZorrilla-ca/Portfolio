<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume - Francisco Zorrilla</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="site-header-inner" id="site-header-inner"></div>
  </header>

  <div class="site-wrapper">
    <main class="main-content">
      <div class="page-body">
        <div id="resume-pdf-source" class="resume-pdf-source">
          <div class="resume-title-row">
            <h1 class="resume-page-title">Resume</h1>
            <button
              type="button"
              id="resume-pdf-download"
              class="resume-pdf-btn"
              aria-label="Download resume as PDF"
            >
              <img src="images/pdf-icon.png" alt="" width="28" height="28" />
            </button>
          </div>
          <div id="resume-content" class="markdown-content">
            <p class="loading">Loading…</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    (async () => {
      const mdPath = typeof SITE_CONFIG !== 'undefined' ? SITE_CONFIG.resumeMarkdown : 'pages/resume.md';
      await renderMarkdownPage('resume-content', mdPath);
      setupResumePdfDownload();
    })();
  </script>
</body>
</html>
